plugins {
  id 'com.android.application'
  id 'kotlin-android'
  id 'kotlin-kapt'
}

kotlin {
  kotlinDaemonJvmArgs = [
    "-Dfile.encoding=UTF-8",
    "--add-opens=jdk.compiler/com.sun.tools.javac.api=ALL-UNNAMED",
    "--add-opens=jdk.compiler/com.sun.tools.javac.code=ALL-UNNAMED",
    "--add-opens=jdk.compiler/com.sun.tools.javac.comp=ALL-UNNAMED",
    "--add-opens=jdk.compiler/com.sun.tools.javac.file=ALL-UNNAMED",
    "--add-opens=jdk.compiler/com.sun.tools.javac.jvm=ALL-UNNAMED",
    "--add-opens=jdk.compiler/com.sun.tools.javac.main=ALL-UNNAMED",
    "--add-opens=jdk.compiler/com.sun.tools.javac.parser=ALL-UNNAMED",
    "--add-opens=jdk.compiler/com.sun.tools.javac.processing=ALL-UNNAMED",
    "--add-opens=jdk.compiler/com.sun.tools.javac.tree=ALL-UNNAMED",
    "--add-opens=jdk.compiler/com.sun.tools.javac.util=ALL-UNNAMED"
  ]

  jvmToolchain(17)
}

android {
  namespace 'com.audiobookshelf.app'
  buildFeatures {
    viewBinding true
    buildConfig true
  }
  kotlinOptions {
    freeCompilerArgs = ['-Xjvm-default=all']
  }
  compileSdk rootProject.ext.compileSdkVersion
  defaultConfig {
    applicationId "com.audiobookshelf.app"
    minSdkVersion rootProject.ext.minSdkVersion
    targetSdkVersion rootProject.ext.targetSdkVersion
    versionCode 121
    versionName "0.14.2-beta"
    testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    manifestPlaceholders = [
      "appAuthRedirectScheme": "com.audiobookshelf.app"
    ]
    aaptOptions {
      // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
      // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
      ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
    }
  }
  sourceSets {
    main {
      java.srcDir(layout.buildDirectory.dir("generated/source/buildstamp"))
    }
  }
  buildTypes {
    debug {
      applicationIdSuffix ".debug"
      versionNameSuffix "-debug"
      minifyEnabled false
      proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
    }
    release {
      minifyEnabled false
      proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
    }
  }
}

repositories {
  flatDir {
    dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
  }
  mavenCentral()
}

configurations.configureEach {
  resolutionStrategy {
    force("com.google.android.gms:play-services-base:18.0.1")
    force("androidx.appcompat:appcompat:$androidxAppCompatVersion")
    force("androidx.core:core-ktx:$androidx_core_ktx_version")
    force("androidx.media:media:$androidx_media_version")
    force("org.jetbrains.kotlinx:kotlinx-coroutines-core:$kotlin_coroutines_version")
    force("org.jetbrains.kotlinx:kotlinx-coroutines-android:$kotlin_coroutines_version")
  }
}

dependencies {
  implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
  implementation fileTree(include: ['*.jar'], dir: 'libs')
  implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
  implementation project(':capacitor-android')

  implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
  implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"

  implementation project(':capacitor-cordova-android-plugins')

  implementation "androidx.core:core-ktx:$androidx_core_ktx_version"
  implementation "androidx.work:work-runtime-ktx:2.9.1"

  implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:$kotlin_coroutines_version"
  implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:$kotlin_coroutines_version"

  implementation "androidx.media:media:$androidx_media_version"

  // Exo Player
  if (findProject(':exoplayer-library-core') != null) {
    implementation project(':exoplayer-library-core')
    implementation project(':exoplayer-library-ui')
    implementation project(':exoplayer-extension-mediasession')
    implementation project(':exoplayer-extension-cast')
    implementation project(':exoplayer-hls')
  } else {
    implementation "com.google.android.exoplayer:exoplayer-core:$exoplayer_version"
    implementation "com.google.android.exoplayer:exoplayer-ui:$exoplayer_version"
    implementation "com.google.android.exoplayer:extension-mediasession:$exoplayer_version"
    implementation "com.google.android.exoplayer:extension-cast:$exoplayer_version"
    implementation "com.google.android.exoplayer:exoplayer-hls:$exoplayer_version"
  }

  // Glide for images
  implementation "com.github.bumptech.glide:glide:$glide_version"

  // Paper NoSQL Db
  implementation 'io.github.pilgr:paperdb:2.7.2'

  // Simple Storage
  implementation "com.anggrayudi:storage:1.5.6"

  // OK HTTP
  implementation 'com.squareup.okhttp3:okhttp:4.9.2'

  // Jackson for JSON
  implementation 'com.fasterxml.jackson.module:jackson-module-kotlin:2.12.2'

  testImplementation "junit:junit:$junitVersion"
}

apply from: 'capacitor.build.gradle'

// BuildConfig fields are static finals, and Kotlin inlines those into AbsLogger.
// An incremental build then keeps the first SHA and timestamp in that class.
// This task writes a non-const getter at execution time. It is not UP-TO-DATE
// and not build-cacheable, so the clock is this build. Git HEAD and refs are
// inputs so a new commit still invalidates it. The rest of the build stays cached.
def repoRoot = rootProject.projectDir.parentFile
def generateBuildStamp = tasks.register("generateBuildStamp") {
  def gitMeta = new File(repoRoot, ".git")
  if (gitMeta.isDirectory()) {
    def head = new File(gitMeta, "HEAD")
    if (head.isFile()) inputs.file(head).withPathSensitivity(PathSensitivity.NONE)
    def refs = new File(gitMeta, "refs")
    if (refs.isDirectory()) inputs.dir(refs).withPathSensitivity(PathSensitivity.RELATIVE)
  } else if (gitMeta.isFile()) {
    inputs.file(gitMeta).withPathSensitivity(PathSensitivity.NONE)
  }
  def outDir = layout.buildDirectory.dir("generated/source/buildstamp")
  outputs.dir(outDir)
  outputs.cacheIf { false }
  outputs.upToDateWhen { false }
  doLast {
    def sha = "unknown"
    def dirty = false
    try {
      def rev = runGit(repoRoot, ["rev-parse", "--short=7", "HEAD"])
      if (rev.code == 0 && rev.out ==~ /[0-9a-fA-F]+/) sha = rev.out
      if (sha != "unknown") {
        def status = runGit(repoRoot, ["status", "--porcelain"])
        if (status.code == 0 && status.out) dirty = true
      }
    } catch (Exception ignored) {
      sha = "unknown"
      dirty = false
    }
    def epoch = System.currentTimeMillis()
    def src = """package com.audiobookshelf.app

object BuildStamp {
  private val rawSha = "${sha}"
  private val dirty = ${dirty}
  private val epochMillis = ${epoch}L
  val GIT_SHA: String
    get() = formatGitSha(rawSha, dirty)
  val BUILD_TIME: String
    get() = formatBuildTime(epochMillis)
}
"""
    def file = new File(outDir.get().asFile, "com/audiobookshelf/app/BuildStamp.kt")
    file.parentFile.mkdirs()
    file.setText(src, "UTF-8")
  }
}

tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
  dependsOn(generateBuildStamp)
}

def runGit(File repo, List<String> args) {
  def process = new ProcessBuilder(["git", "-C", repo.absolutePath] + args).start()
  def stdout = new StringBuilder()
  def stderr = new StringBuilder()
  def outThread = Thread.start { stdout.append(process.inputStream.getText("UTF-8")) }
  def errThread = Thread.start { stderr.append(process.errorStream.getText("UTF-8")) }
  def code = process.waitFor()
  outThread.join()
  errThread.join()
  return [code: code, out: stdout.toString().trim()]
}
